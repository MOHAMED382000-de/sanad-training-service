name: SANAD CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  run-tests:
    name: Run Environment Setup & Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Environment File
        run: |
          cp .env.example .env
          echo "Environment file created successfully."

      - name: Check Project Structure
        run: ls -la

  security-scan:
    name: Security & Secrets Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Basic Secrets & Key Leak Verification
        run: |
          echo "Scanning project files for exposed secrets..."
          ! grep -rnI "AWS_SECRET\|PRIVATE_KEY\|DB_PASSWORD=root" . --exclude-dir=.git --exclude-dir=.github || exit 1
          echo "No hardcoded secrets detected in source files."